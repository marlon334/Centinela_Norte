<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Capacitación | Centinela del Norte</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Icons & Styles -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/global.css">
</head>

<body>

  <header id="header-container"></header>

  <main>
    <section class="page-header">
      <div class="container">
        <span class="tag animate-on-scroll">Formación Profesional</span>
        <h1 class="animate-on-scroll">Agendar Capacitación</h1>
        <p class="subtext animate-on-scroll" style="margin: 1.5rem auto;">Reserve su cupo en nuestros programas de
          certificación y entrenamiento táctico.</p>
      </div>
    </section>

    <section class="booking-form">
      <div class="container">
        <div class="glass-card responsive-card animate-on-scroll" style="max-width: 700px; margin: 0 auto;">
          <form class="contact-form" style="display: grid; gap: 2rem;">
            <div class="form-grid">
              <div class="form-group">
                <label
                  style="display: block; margin-bottom: 0.75rem; font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Nombre
                  Completo</label>
                <input type="text" placeholder="Ej. Juan Pérez"
                  style="width: 100%; padding: 1.25rem; background: #fff; border: 1px solid var(--border); border-radius: 12px; color: var(--navy); font-weight: 500;">
              </div>
              <div class="form-group">
                <label
                  style="display: block; margin-bottom: 0.75rem; font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Correo
                  Electrónico</label>
                <input type="email" placeholder="juan@ejemplo.com"
                  style="width: 100%; padding: 1.25rem; background: #fff; border: 1px solid var(--border); border-radius: 12px; color: var(--navy); font-weight: 500;">
              </div>
            </div>
            <div class="form-grid">
              <div class="form-group">
                <label
                  style="display: block; margin-bottom: 0.75rem; font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Fecha
                  Preferida</label>
                <input type="date"
                  style="width: 100%; padding: 1.25rem; background: #fff; border: 1px solid var(--border); border-radius: 12px; color: var(--navy); font-weight: 500;">
              </div>
              <div class="form-group">
                <label
                  style="display: block; margin-bottom: 0.75rem; font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Nivel
                  de Curso</label>
                <select
                  style="width: 100%; padding: 1.25rem; background: #fff; border: 1px solid var(--border); border-radius: 12px; color: var(--navy); appearance: none; cursor: pointer; font-weight: 500;">
                  <option>Curso Nivel 1</option>
                  <option>Curso Nivel 2</option>
                  <option>Supervisor</option>
                  <option>VIP</option>
                </select>
              </div>
            </div>
            <button class="btn-yellow" style="width: 100%; justify-content: center; padding: 1.5rem;">Agendar
              Ahora</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer-container"></footer>

  <script src="js/components.js"></script>
</body>

</html>
