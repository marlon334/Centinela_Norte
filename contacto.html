<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Vigilancia Elite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="css/global.css">
</head>

<body>

  <header id="header-container"></header>

  <main>
    <section id="contacto" class="contact">
      <div class="container">
        <div class="contact-header">
          <h2>Hable con un experto</h2>
          <p class="subtext">Solicite una auditoría de seguridad gratuita para su propiedad o negocio.</p>
        </div>

        <div class="contact-grid">
          <div class="contact-info">
            <div class="info-box">
              <div class="info-icon"><i class="fas fa-phone"></i></div>
              <div class="info-text">
                <span>Llámenos</span>
                <strong>+52 (55) 1234-5678</strong>
              </div>
            </div>
            <div class="info-box">
              <div class="info-icon"><i class="fas fa-envelope"></i></div>
              <div class="info-text">
                <span>Email</span>
                <strong>contacto@vigilanciaelite.com</strong>
              </div>
            </div>
            <div class="info-box">
              <div class="info-icon"><i class="fas fa-map-marker-alt"></i></div>
              <div class="info-text">
                <span>Ubicación</span>
                <strong>Distrito de Negocios, CDMX</strong>
              </div>
            </div>
          </div>
          <form class="contact-form">
            <input type="text" placeholder="Nombre completo">
            <input type="email" placeholder="Correo electrónico">
            <textarea placeholder="¿En qué podemos ayudarle?" class="full"></textarea>
            <button type="submit" class="btn-yellow full">ENVIAR MENSAJE</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer-container"></footer>

  <script src="js/components.js"></script>
</body>

</html>
